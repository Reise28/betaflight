name: RECOVER Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GEPRCF722
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build toolchain
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: tools
          key: ${{ runner.os }}-${{ hashFiles('mk/tools.mk') }}

      - name: Download and install toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: make arm_sdk_install

      - name: Hydrate configuration
        run: make configs

      - name: Show GEPRCF722 configuration
        run: |
          echo "=== src/config ==="
          ls -la src/config
          echo "=== GEPR configs ==="
          find src/config -maxdepth 4 -iname '*GEPR*' -print
          echo "=== GEPRCF722 config.h ==="
          test -f src/config/configs/GEPRCF722/config.h && echo "FOUND" || echo "NOT FOUND"

      - name: Build GEPRCF722
        run: make EXTRA_FLAGS=-Werror CONFIG=GEPR/GEPRCF722

      - name: Publish firmware
        uses: actions/upload-artifact@v4
        with:
          name: RECOVER-GEPRCF722
          path: obj/*.hex
          retention-days: 30
